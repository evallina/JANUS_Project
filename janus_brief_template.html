document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 uppercase;\">{{ runLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"no-print\" style=\"border-top: 1.5px solid #111110; display: flex; justify-content: flex-end; gap: 2px; padding: 6px 0;\">\n    <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ v.set }}\" style=\"border: none; background: {{ v.bg }}; color: {{ v.fg }}; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 10px; cursor: pointer; transition: background 180ms ease, color 180ms ease;\" style-hover=\"background: #dedcd5; color: #111110\">{{ v.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- Linear calendar: day strip (1W \u002F 4W) -->\n  <sc-if value=\"{{ showStrip }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #c9c7c0; border-top: 1px solid #c9c7c0; animation: calIn 260ms ease both;\">\n      <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n        <div sc-camel-on-click=\"{{ d.pick }}\" sc-camel-on-mouse-enter=\"{{ d.enter }}\" sc-camel-on-mouse-leave=\"{{ d.leave }}\" style=\"outline: {{ d.outline }}; outline-offset: -2px; border-right: 1px solid #c9c7c0; border-bottom: 1px solid #c9c7c0; padding: {{ calPad }}; background: {{ d.bg }}; color: {{ d.fg }}; min-width: 0; cursor: {{ d.cursor }}; transition: background 220ms ease, color 220ms ease, padding 260ms cubic-bezier(.4,0,.2,1);\">\n          <div style=\"display: flex; gap: 4px; height: 8px; align-items: center;\">\n            <sc-for list=\"{{ d.dots }}\" as=\"dot\" hint-placeholder-count=\"0\">\n              <span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{ dot.c }}; display: block;\"><\u002Fspan>\n            <\u002Fsc-for>\n            <span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{ d.userDot }}; display: block;\"><\u002Fspan>\n          <\u002Fdiv>\n\n          <div ty;\">{{ q.text }}<\u002Fspan>\n            <span style=\"flex: 0 0 52px; text-align: right; font-size: 11px; color: {{ q.noteHintColor }};\">{{ q.noteHint }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ q.noteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 0 clamp(4px, 1vw, 12px) 14px clamp(46px, 5vw, 60px); animation: noteIn 200ms ease both;\">\n              <textarea value=\"{{ q.note }}\" sc-camel-on-change=\"{{ q.setNote }}\" placeholder=\"Your answer \u002F reply\u2026\" style=\"width: 100%; min-height: 62px; resize: vertical; background: #E0DED8; border: 1px solid #c9c7c0; padding: 9px 11px; font-family: inherit; font-size: 13px; line-height: 1.5; color: #111110;\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Export -->\n  <!-- 07 SUGGESTED CALENDAR ADDITIONS -->\n  <sc-if value=\"{{ hasCalAdds }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; flex-wrap: wrap; border-bottom: 1px solid #c9c7c0;\">\n      <div style=\"flex: 0 0 170px; padding: 22px 12px 22px 0;\">\n        <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n          <span style=\"font-size: 13px; color: #8a8880; font-variant-numeric: tabular-nums;\">07<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em;\">TO ADD TO CALENDAR<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 480px; border-left: 1px solid #c9c7c0;\">\n        <sc-for list=\"{{ calAdds }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 12px clamp(4px, 1vw, 12px) 12px clamp(14px, 2.5vw, 28px); border-bottom: 1px solid #dedcd5;\">\n            <span style=\"font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;\">{{ a.date }}<\u002Fspan>\n            <span style=\"font-size: 11px; color: #8a8880; font-variant-numeric: tabular-nums; white-space: nowrap;\">{{ a.range }}<\u002Fspan>\n            <span style=\"flex: 1 1 220px; font-size: 14px; line-height: 1.5;\">{{ a.text }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div class=\"no-print\" style=\"margin: 26px 0 0; border: 1px solid #111110; padding: 5px 5px 5px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-color: #D1D1D1\">\n    <span style=\"font-size: 10px; letter-spacing: 0.14em; color: #6b6a66;\">SHARE<\u002Fspan>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 5px; align-items: center;\">\n      \n      <button sc-camel-on-click=\"{{ exportMd }}\" style=\"border: 1px solid #111110; background: transparent; color: #111110; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 6px 13px; cursor: pointer; transition: background 160ms ease, color 160ms ease;\" style-hover=\"background: #111110; color: #E8E6E1\">EXPORT MARKDOWN<\u002Fbutton><button sc-camel-on-click=\"{{ exportPdf }}\" style=\"border: 1px solid #111110; background: #111110; color: #E8E6E1; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 6px 13px; cursor: pointer; transition: background 160ms ease, color 160ms ease;\" style-hover=\"background: transparent; color: #111110\">EXPORT PDF<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Footer -->\n  <div style=\"border-top: 1.5px solid #111110; margin-top: 28px; padding-top: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: #6b6a66;\">\n    <span>{{ footerStatus }}<\u002Fspan>\n    <span style=\"font-family: 'Permanent Marker', cursive; color: #111110;\">by Palpable Studio<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0F7A4D&quot;,&quot;options&quot;:[&quot;#E8451F&quot;,&quot;#1F4BE8&quot;,&quot;#0F7A4D&quot;,&quot;#111110&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\n\u002F* ================================================================\n   JANUS DAILY \u2014 TEMPLATE LOGIC (v3)\n   Everything between DAILY DATA START and DAILY DATA END is the ONLY\n   part that changes from day to day. The rest of this file, and all\n   HTML above, must be copied verbatim on every run.\n   ================================================================ *\u002F\n\n\u002F* ===== DAILY DATA START ===== *\u002F\nconst BRIEF = {\n  date: \"2026-01-01\",\n  runNumber: 0,\n  quote: { text: \"Template not yet populated.\", author: \"Janus\" },\n  variant: null,\n  calendarEvents: [],\n  professional: [{ pri: \"P2\", tag: \"Example\", text: \"This is the empty template. The daily run replaces this block.\", when: \"morning\" }],\n  personal: [],\n  week: [],\n  waitingOn: [{ text: \"Nothing pending.\", accent: false }],\n  summary: \"Placeholder. Replace the DAILY DATA block to populate this brief.\",\n  longView: \"Placeholder.\",\n  questions: [],\n  calendar: { marks: {}, tentative: [], activity: {} },\n  footerStatus: \"Template \u2014 not a real run.\"\n};\n\u002F* ===== DAILY DATA END ===== *\u002F\n\n\u002F* ---------- derived constants (do not edit) ---------- *\u002F\nconst TODAY = BRIEF.date;\nconst KEY = 'daily-brief-' + TODAY;\nconst PLACEHOLDERS = { professional: 'Add a professional task\u2026', personal: 'Add a personal task\u2026', week: 'Add something for this week\u2026' };\nconst P = TODAY.split('-').map(Number);\nconst BASE = new Date(P[0], P[1] - 1, P[2]);\nconst WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nconst MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst isoKey = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');\nconst withIds = (list, prefix) => list.map((t, i) => Object.assign({ id: prefix + (i + 1) }, t));\nconst SEED = {\n  professional: withIds(BRIEF.professional, 'professional'),\n  personal: withIds(BRIEF.personal, 'personal'),\n  week: withIds(BRIEF.week, 'week'),\n  questions: withIds(BRIEF.questions, 'q').map((q, i) => Object.assign({ n: String(i + 1).padStart(2, '0') }, q))\n};\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let saved = { done: {}, notes: {} };\n    try { saved = Object.assign(saved, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}\n    const raw = saved.dayNotes || {};\n    const dayNotes = {};\n    Object.keys(raw).forEach(k => {\n      const v = raw[k];\n      dayNotes[k] = Array.isArray(v) ? v : (v && v.text ? [v] : []);\n    });\n    this.state = { done: saved.done || {}, notes: saved.notes || {}, dayNotes: dayNotes, added: saved.added || { professional: [], personal: [], week: [] }, drafts: {}, open: {}, view: '1w', sel: '' };\n  }\n  persist(next) {\n    try { localStorage.setItem(KEY, JSON.stringify({ done: next.done, notes: next.notes, dayNotes: next.dayNotes || this.state.dayNotes, added: next.added || this.state.added })); } catch (e) {}\n  }\n  toggle(id, ev) {\n    if (ev && ev.stopPropagation) ev.stopPropagation();\n    this.setState(s => {\n      const done = Object.assign({}, s.done, { [id]: !s.done[id] });\n      this.persist({ done, notes: s.notes });\n      return { done };\n    });\n  }\n  openNote(id) {\n    this.setState(s => ({ open: Object.assign({}, s.open, { [id]: !s.open[id] }) }));\n  }\n  setNote(id, ev) {\n    const v = ev.target.value;\n    this.setState(s => {\n      const notes = Object.assign({}, s.notes, { [id]: v });\n      this.persist({ done: s.done, notes });\n      return { notes };\n    });\n  }\n  selectDay(k) {\n    this.setState(s => ({ sel: s.sel === k ? '' : k }));\n  }\n  writeDay(k, list) {\n    this.setState(s => {\n      const dayNotes = Object.assign({}, s.dayNotes, { [k]: list });\n      if (!list.length) delete dayNotes[k];\n      this.persist({ done: s.done, notes: s.notes, dayNotes });\n      return { dayNotes };\n    });\n  }\n  setDayField(k, i, field, value) {\n    const list = (this.state.dayNotes[k] || []).slice();\n    list[i] = Object.assign({ text: '', end: '' }, list[i], { [field]: value });\n    this.writeDay(k, list);\n  }\n  addDayEntry(k) {\n    this.writeDay(k, (this.state.dayNotes[k] || []).concat({ text: '', end: '' }));\n  }\n  removeDayEntry(k, i) {\n    const list = (this.state.dayNotes[k] || []).slice();\n    list.splice(i, 1);\n    this.writeDay(k, list);\n  }\n  calendarAdds() {\n    const dn = this.state.dayNotes || {};\n    const out = [];\n    Object.keys(dn).sort().forEach(k => {\n      (dn[k] || []).forEach(e => {\n        if (!e || !e.text) return;\n        out.push({ date: k, end: e.end && e.end > k ? e.end : '', text: e.text });\n      });\n    });\n    return out;\n  }\n  openAdder(group) {\n    this.setState(s => ({ adderOpen: Object.assign({}, s.adderOpen || {}, { [group]: true }) }), () => {\n      const el = this.adderRefs && this.adderRefs[group];\n      if (el) el.focus();\n    });\n  }\n  closeAdder(group) {\n    if ((this.state.drafts[group] || '').trim()) return;\n    this.setState(s => ({ adderOpen: Object.assign({}, s.adderOpen || {}, { [group]: false }) }));\n  }\n  setDraft(group, value) {\n    this.setState(s => ({ drafts: Object.assign({}, s.drafts, { [group]: value }) }));\n  }\n  addTask(group) {\n    const text = (this.state.drafts[group] || '').trim();\n    if (!text) return;\n    this.setState(s => {\n      const list = (s.added[group] || []).concat({ id: group + '-u' + Date.now(), pri: 'P2', text: text, user: true });\n      const added = Object.assign({}, s.added, { [group]: list });\n      this.persist({ done: s.done, notes: s.notes, added });\n      return { added, drafts: Object.assign({}, s.drafts, { [group]: '' }) };\n    });\n  }\n  removeTask(group, id, ev) {\n    if (ev && ev.stopPropagation) ev.stopPropagation();\n    this.setState(s => {\n      const added = Object.assign({}, s.added, { [group]: (s.added[group] || []).filter(t => t.id !== id) });\n      this.persist({ done: s.done, notes: s.notes, added });\n      return { added };\n    });\n  }\n  data() {\n    return {\n      professional: SEED.professional.concat(this.state.added.professional || []),\n      personal: SEED.personal.concat(this.state.added.personal || []),\n      week: SEED.week.concat(this.state.added.week || []),\n      questions: SEED.questions\n    };\n  }\n  hydrate(items) {\n    const accent = this.props.accent ?? '#0F7A4D';\n    const { done, notes, open } = this.state;\n    return items.map(t => Object.assign({}, t, {\n      toggle: (ev) => this.toggle(t.id, ev),\n      openNote: () => this.openNote(t.id),\n      setNote: (ev) => this.setNote(t.id, ev),\n      note: notes[t.id] || '',\n      noteOpen: !!open[t.id],\n      noteHint: notes[t.id] ? '\u25cf note' : '',\n      noteHintColor: accent,\n      check: done[t.id] ? '\u2715' : '',\n      boxBg: done[t.id] ? '#111110' : 'transparent',\n      deco: done[t.id] ? 'line-through' : 'none',\n      rowOpacity: done[t.id] ? 0.45 : 1,\n      priColor: t.pri === 'P1' ? accent : '#8a8880',\n      tagText: t.tag ? t.tag + ' \u2014 ' : '',\n      delLabel: t.user ? '\u2715' : '',\n      del: t.user ? ((ev) => this.removeTask(t.id.split('-')[0], t.id, ev)) : ((ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); })\n    }));\n  }\n  markdown() {\n    const d = this.data();\n    const { done, notes } = this.state;\n    const line = (t, withMeta) => {\n      let s = '- [' + (done[t.id] ? 'x' : ' ') + '] ' + (t.pri ? t.pri + ' \u00b7 ' : '') + (t.tag ? t.tag + ' \u2014 ' : '') + t.text;\n      if (t.user) s += ' **[ADDED BY ENOL]**';\n      if (withMeta && t.when) s += ' _(' + t.when + ')_';\n      if (notes[t.id]) s += '\\n  > ' + notes[t.id];\n      return s;\n    };\n    const out = [];\n    out.push('# Janus Daily \u2014 ' + WEEKDAYS[BASE.getDay()] + ', ' + MONTHS[BASE.getMonth()] + ' ' + BASE.getDate() + ', ' + BASE.getFullYear() + ' (Run ' + BRIEF.runNumber + ')', '');\n    out.push('> \u201c' + BRIEF.quote.text + '\u201d \u2014 ' + BRIEF.quote.author, '');\n    if (BRIEF.variant && BRIEF.variant.lines && BRIEF.variant.lines.length) {\n      out.push('## ' + BRIEF.variant.title, '');\n      BRIEF.variant.lines.forEach(v => out.push('- **' + v.label + '** \u2014 ' + v.text));\n      out.push('');\n    }\n    out.push('## Today', '', '**Professional**', '');\n    d.professional.forEach(t => out.push(line(t, true)));\n    out.push('', '**Personal**', '');\n    d.personal.forEach(t => out.push(line(t, true)));\n    out.push('', '**Calendar**', '');\n    if (BRIEF.calendarEvents.length) BRIEF.calendarEvents.forEach(e => out.push('- ' + e.time + ' \u2014 ' + e.title + (e.note ? ' _(' + e.note + ')_' : '')));\n    else out.push('- No events on the calendar today.');\n    out.push('', '## This Week', '');\n    d.week.forEach(t => out.push(line(t, false)));\n    out.push('', '## Waiting On', '');\n    BRIEF.waitingOn.forEach(w => out.push('- ' + w.text));\n    out.push('', '## Brief Summary', '', BRIEF.summary);\n    if (notes.summary) out.push('', '> ' + notes.summary);\n    out.push('', '## Long View', '', BRIEF.longView);\n    if (notes.longview) out.push('', '> ' + notes.longview);\n    if (notes.waiting) out.push('', '_Waiting On note:_ ' + notes.waiting);\n    const adds = this.calendarAdds();\n    if (adds.length) {\n      out.push('', '## Suggested Calendar Additions', '');\n      adds.forEach(a => out.push('- **' + a.date + (a.end ? ' \u2192 ' + a.end : '') + '** \u2014 ' + a.text));\n    }\n    out.push('', '## Questions', '');\n    d.questions.forEach(q => {\n      out.push('- ' + q.text);\n      if (notes[q.id]) out.push('  > ' + notes[q.id]);\n    });\n    out.push('', '---', BRIEF.footerStatus + ' \u2014 Janus');\n    return out.join('\\n');\n  }\n  downloadMd() {\n    const blob = new Blob([this.markdown()], { type: 'text\u002Fmarkdown;charset=utf-8' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'janus-daily-' + TODAY + '.md';\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n  }\n  calendar() {\n    const accent = this.props.accent ?? '#0F7A4D';\n    const view = this.state.view;\n    const marks = BRIEF.calendar.marks || {};\n    const tentative = (BRIEF.calendar.tentative || []).slice();\n    const hatch = 'repeating-linear-gradient(45deg, rgba(17,17,16,0.20) 0 1.5px, transparent 1.5px 6px)';\n    const tentFor = k => tentative.find(t => k >= t.start && k <= t.end);\n    const activity = {};\n    Object.keys(BRIEF.calendar.activity || {}).forEach(k => { activity[k] = (BRIEF.calendar.activity[k] || []).slice(); });\n    const dn = this.state.dayNotes;\n    const hasUser = k => (dn[k] || []).some(e => e && e.text);\n    Object.keys(dn).forEach(k => {\n      (dn[k] || []).forEach(e => {\n        if (!e || !e.text) return;\n        const suffix = e.end && e.end > k ? ' (through ' + e.end + ')' : '';\n        activity[k] = (activity[k] || []).concat('Yours: ' + e.text + suffix);\n        if (e.end && e.end > k) tentative.push({ start: k, end: e.end, label: 'Yours: ' + e.text, user: true });\n      });\n    });\n    const labelFor = k => {\n      const parts = (activity[k] || []).slice();\n      const t = tentFor(k);\n      if (t) parts.push(t.label);\n      return parts.length ? new Date(k + 'T00:00:00').toDateString().slice(0, 10) + ' \u2014 ' + parts.join(' \u00b7 ') : '';\n    };\n    const hoverProps = k => {\n      const label = labelFor(k);\n      return label\n        ? { enter: () => this.setState({ hover: label }), leave: () => this.setState({ hover: '' }), cursor: 'pointer' }\n        : { enter: () => {}, leave: () => {}, cursor: 'pointer' };\n    };\n    const days = [];\n    const count = view === '4w' ? 28 : 7;\n    for (let i = 0; i < count; i++) {\n      const dt = new Date(BASE.getFullYear(), BASE.getMonth(), BASE.getDate() - 1 + i);\n      const k = isoKey(dt);\n      const today = k === TODAY;\n      const tent = tentFor(k);\n      const dots = (activity[k] || []).map(() => ({ c: today ? '#E8E6E1' : (marks[k] === 'deadline' ? accent : '#111110') }));\n      days.push(Object.assign({\n        num: String(dt.getDate()).padStart(2, '0'),\n        name: view === '4w' ? WEEKDAYS[dt.getDay()].slice(0, 3) + ' \u00b7 ' + MONTHS[dt.getMonth()].slice(0, 3) : WEEKDAYS[dt.getDay()],\n        dots,\n        bg: today ? '#111110' : (tent ? hatch : 'transparent'),\n        fg: today ? '#E8E6E1' : (k < TODAY ? '#a5a39c' : '#111110'),\n        sub: today ? '#b3b1a9' : '#8a8880',\n        deco: k < TODAY ? 'line-through' : 'none',\n        outline: this.state.sel === k ? '2px solid ' + accent : 'none',\n        pick: () => this.selectDay(k),\n        userDot: hasUser(k) ? accent : 'transparent'\n      }, hoverProps(k)));\n    }\n    const monthRows = [];\n    for (let mm = 0; mm < 6; mm++) {\n      const first = new Date(BASE.getFullYear(), BASE.getMonth() + mm, 1);\n      const y = first.getFullYear(), m = first.getMonth();\n      const mk = y + '-' + String(m + 1).padStart(2, '0');\n      const len = new Date(y, m + 1, 0).getDate();\n      const cells = [];\n      for (let day = 1; day <= 31; day++) {\n        if (day > len) { cells.push({ num: '', bg: 'rgba(0,0,0,0.05)', fg: '#8a8880', enter: () => {}, leave: () => {}, cursor: 'default', dotOpacity: 0, dotColor: 'transparent', deco: 'none', outline: 'none', pick: () => {} }); continue; }\n        const k = isoKey(new Date(y, m, day));\n        const today = k === TODAY;\n        const deadline = marks[k] === 'deadline';\n        const tent = tentFor(k);\n        const hasAct = !!(activity[k] || []).length;\n        const past = k < TODAY;\n        cells.push(Object.assign({\n          num: String(day),\n          bg: today ? '#111110' : (deadline ? accent : (tent ? hatch : 'transparent')),\n          fg: today || deadline ? '#E8E6E1' : (past ? '#a5a39c' : '#6b6a66'),\n          deco: past ? 'line-through' : 'none',\n          dotOpacity: hasAct && !today && !deadline ? 1 : 0,\n          dotColor: hasUser(k) ? accent : '#111110',\n          outline: this.state.sel === k ? '2px solid ' + accent : 'none',\n          pick: () => this.selectDay(k)\n        }, hoverProps(k)));\n      }\n      const monthStart = mk + '-01';\n      const monthEnd = mk + '-' + String(len).padStart(2, '0');\n      const bands = tentative.filter(t => t.start <= monthEnd && t.end >= monthStart).map(t => {\n        const s = (t.start >= monthStart ? Number(t.start.slice(8)) : 1) - 1;\n        const e = t.end <= monthEnd ? Number(t.end.slice(8)) : len;\n        return {\n          left: 'calc(74px + (100% - 74px) * ' + (s \u002F 31).toFixed(5) + ')',\n          width: 'calc((100% - 74px) * ' + ((e - s) \u002F 31).toFixed(5) + ')',\n          enter: () => this.setState({ hover: t.label }),\n          leave: () => this.setState({ hover: '' })\n        };\n      });\n      monthRows.push({\n        label: MONTHS[m].slice(0, 3).toUpperCase() + ' ' + String(y).slice(2),\n        rowBg: mm % 2 === 0 ? 'transparent' : 'rgba(0,0,0,0.035)',\n        cells, bands\n      });\n    }\n    const hover = this.state.hover || '';\n    const sel = this.state.sel;\n    const list = (sel && this.state.dayNotes[sel]) || [];\n    const selDate = sel ? new Date(sel + 'T00:00:00') : null;\n    return {\n      selDay: !!sel,\n      selLabel: selDate ? WEEKDAYS[selDate.getDay()] + ', ' + MONTHS[selDate.getMonth()] + ' ' + selDate.getDate() + ', ' + selDate.getFullYear() : '',\n      selMin: sel,\n      selEntries: (list.length ? list : [{ text: '', end: '' }]).map((e, i) => ({\n        text: e.text || '',\n        end: e.end || '',\n        n: String(i + 1).padStart(2, '0'),\n        setText: (ev) => this.setDayField(sel, i, 'text', ev.target.value),\n        setEnd: (ev) => this.setDayField(sel, i, 'end', ev.target.value),\n        remove: () => this.removeDayEntry(sel, i)\n      })),\n      addSelEntry: () => this.addDayEntry(sel),\n      selCovering: !sel ? [] : Object.keys(this.state.dayNotes).reduce((acc, k) => {\n        if (k === sel) return acc;\n        (this.state.dayNotes[k] || []).forEach(e => {\n          if (e && e.text && e.end && sel > k && sel <= e.end) acc.push({ text: e.text, from: k, jump: () => this.setState({ sel: k }) });\n        });\n        return acc;\n      }, []),\n      closeSel: () => this.setState({ sel: '' }),\n      days, monthRows,\n      showStrip: view !== '6m', showSixMonth: view === '6m',\n      hoverLabel: hover || 'Hover a marked day to see what\u2019s scheduled \u00b7 click any day to add your own note',\n      hoverColor: hover ? '#111110' : '#8a8880',\n      hoverHatch: hatch\n    };\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#0F7A4D';\n    const view = this.state.view;\n    const d = this.data();\n    const todayItems = d.professional.concat(d.personal);\n    const cal = this.calendar();\n    const notes = this.state.notes;\n    const waitingItems = BRIEF.waitingOn.map((w, i) => ({\n      text: w.text,\n      dot: w.accent ? accent : '#b3b1a9',\n      color: w.accent ? '#111110' : '#6b6a66',\n      hint: i === 0 ? (notes.waiting ? '\u25cf note' : '') : '',\n      hintColor: accent\n    }));\n    const adders = ['professional', 'personal', 'week'].reduce((acc, g) => {\n      const open = !!(this.state.adderOpen || {})[g];\n      acc[g] = {\n        value: this.state.drafts[g] || '',\n        set: (ev) => this.setDraft(g, ev.target.value),\n        add: () => { if (!open) { this.openAdder(g); return; } this.addTask(g); },\n        key: (ev) => { if (ev.key === 'Enter') this.addTask(g); if (ev.key === 'Escape') this.closeAdder(g); },\n        blur: () => this.closeAdder(g),\n        ref: (el) => { this.adderRefs = this.adderRefs || {}; this.adderRefs[g] = el; },\n        open: open,\n        closed: !open,\n        placeholder: PLACEHOLDERS[g]\n      };\n      return acc;\n    }, {});\n    return Object.assign({\n      accent,\n      runLabel: 'Run ' + String(BRIEF.runNumber).padStart(3, '0'),\n      dateTop: WEEKDAYS[BASE.getDay()],\n      dateBottom: MONTHS[BASE.getMonth()] + ' ' + BASE.getDate() + ', ' + BASE.getFullYear(),\n      quoteText: BRIEF.quote.text,\n      quoteAuthor: BRIEF.quote.author,\n      hasVariant: !!(BRIEF.variant && BRIEF.variant.lines && BRIEF.variant.lines.length),\n      variantTitle: BRIEF.variant ? BRIEF.variant.title : '',\n      variantLines: BRIEF.variant ? BRIEF.variant.lines : [],\n      calEvents: BRIEF.calendarEvents,\n      hasCalEvents: BRIEF.calendarEvents.length > 0,\n      noCalEvents: BRIEF.calendarEvents.length === 0,\n      waitingItems,\n      summaryText: BRIEF.summary,\n      longViewText: BRIEF.longView,\n      footerStatus: BRIEF.footerStatus,\n      adders,\n      calPad: view === '4w' ? 'clamp(4px, 0.8vw, 8px) clamp(5px, 0.9vw, 12px) clamp(5px, 0.9vw, 10px)' : 'clamp(6px, 1.2vw, 12px) clamp(6px, 1vw, 14px) clamp(8px, 1.4vw, 14px)',\n      calNumSize: view === '4w' ? 'clamp(14px, 2.4vw, 26px)' : 'clamp(22px, 5vw, 52px)',\n      calNumGap: view === '4w' ? '4px' : 'clamp(6px, 1.5vw, 18px)',\n      views: [['1w', '1W'], ['4w', '4W'], ['6m', '6M']].map(([id, label]) => ({\n        label,\n        set: () => this.setState({ view: id }),\n        bg: view === id ? '#111110' : 'transparent',\n        fg: view === id ? '#E8E6E1' : '#8a8880'\n      })),\n      professional: this.hydrate(d.professional),\n      personal: this.hydrate(d.personal),\n      week: this.hydrate(d.week),\n      questions: this.hydrate(d.questions),\n      doneCount: todayItems.filter(t => this.state.done[t.id]).length,\n      totalCount: todayItems.length,\n      summaryNoteOpen: !!this.state.open.summary,\n      summaryNote: notes.summary || '',\n      summaryNoteColor: notes.summary ? accent : '#8a8880',\n      summaryNoteHint: notes.summary ? '\u25cf note' : '',\n      toggleSummaryNote: () => this.openNote('summary'),\n      setSummaryNote: (ev) => this.setNote('summary', ev),\n      longNoteOpen: !!this.state.open.longview,\n      longNote: notes.longview || '',\n      longNoteColor: notes.longview ? accent : '#8a8880',\n      longNoteHint: notes.longview ? '\u25cf note' : '',\n      toggleLongNote: () => this.openNote('longview'),\n      setLongNote: (ev) => this.setNote('longview', ev),\n      waitingNoteOpen: !!this.state.open.waiting,\n      waitingNote: notes.waiting || '',\n      waitingNoteColor: notes.waiting ? accent : '#8a8880',\n      waitingNoteHint: notes.waiting ? '\u25cf note' : '',\n      toggleWaitingNote: () => this.openNote('waiting'),\n      setWaitingNote: (ev) => this.setNote('waiting', ev),\n      calAdds: this.calendarAdds().map(a => ({\n        date: new Date(a.date + 'T00:00:00').toDateString().slice(0, 10),\n        range: a.end ? '\u2192 ' + new Date(a.end + 'T00:00:00').toDateString().slice(0, 10) : '',\n        text: a.text\n      })),\n      hasCalAdds: this.calendarAdds().length > 0,\n      exportPdf: () => window.print(),\n      exportMd: () => this.downloadMd()\n    }, cal);\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
